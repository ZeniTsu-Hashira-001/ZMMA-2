services:
  - type: web
    name: zmma
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MEMORY_THRESHOLD_PERCENT
        value: "85"
      - key: MAX_IMAGE_BYTES
        value: "10485760"
      - key: RATE_LIMIT_DEFAULT
        value: "30/minute"